spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ott_chat}?currentSchema=ai_knowledge,public

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ai_knowledge
server.port=8080
spring.jpa.open-in-view=false
spring.sql.init.mode=always
config.stopBubbling = true
lombok.addLombokGeneratedAnnotation = true



spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_ID}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.rabbitmq.ssl.verify-hostname= ${VERIFY_EMAIL_HOST:true}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.profiles.active=${ACTIVE_PROFILE}
logging.level.org.springframework.security=DEBUG

#jwt.header=Authorization
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
#jwt.route.authentication.path=/auth
#jwt.route.authentication.refresh=/refresh

# ============================================
# RAG System Configuration
# ============================================

# AI config
spring.ai.google.genai.api-key= ${API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.modle=${GEMINI_MODEL:gemini-3.1-flash-lite}

# Multi-LLM API Keys
llm.openai.api-key=${OPENAI_API_KEY:}
llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
#spring.ai.google.genai.chat.options.thinking-budget
spring.ai.google.genai.chat.options.temperature=0.5

spring.ai.google.genai.embedding.api-key=${API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.options.dimensions=768

spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=ai_knowledge
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=IVFFLAT

# Chat Memory (conversation history stored in PostgreSQL)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=postgresql

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
#app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.dir=uploads

# Async Task Executor
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ============================================
# Phase 2: AI Agent Tool Calling
# ============================================
messaging.service.url=${MESSAGING_SERVICE_URL}
agent.tools.enabled=true

# NATS for event subscription (file.document.uploaded)
nats.url=${NATS_URL}