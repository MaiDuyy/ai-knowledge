# Active profile properties for testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS ai_knowledge
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
# B?t Hibernate lm vi?c trong schema ai_knowledge
spring.jpa.properties.hibernate.default_schema=ai_knowledge
spring.datasource.hikari.maximum-pool-size=50
spring.sql.init.mode=never
# Gip Hibernate qu?n l schema t?t h?n (??c bi?t v?i H2)
spring.jpa.properties.hibernate.hbm2ddl.schema_management_tool=org.hibernate.tool.schema.internal.HibernateSchemaManagementTool
# Disable NATS config & other external services by providing dummy URLs/keys
nats.url=nats://localhost:4222
gateway.shared-key=test-gateway-key
API_KEY=${GEMINI_API_KEY:dummy-api-key-for-test}
spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.embedding.api-key=${API_KEY}
spring.ai.google.genai.project-id=test-gcp-project
JWT_SECRET=dummy-secret-dummy-secret-dummy-secret-dummy-secret
JWT_EXPIRATION=3600000
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=test
POSTGRES_USER=sa
POSTGRES_PASSWORD=
EMAIL_HOST=localhost
EMAIL_PORT=25
EMAIL_ID=dummy
EMAIL_PASSWORD=dummy
MESSAGING_SERVICE_URL=http://localhost:3020

# Disable script initializations
spring.sql.init.mode=never
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=h2

# Exclude Redis Auto-configurations & PgVectorStoreAutoConfiguration & Mongo (experimental)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,\
org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration,\
org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration

# Mongo experimental defaults (only used when profile mongodb* is active)
mongo.use-nested-chunks=true
mongo.vector.mode=brute-force
mongo.vector.dimensions=768
