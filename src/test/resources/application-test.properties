# Active profile properties for testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS ai_knowledge
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=

# Disable NATS config & other external services by providing dummy URLs/keys
nats.url=nats://localhost:4222
API_KEY=dummy-key-dummy-key-dummy-key-dummy-key
JWT_SECRET=dummy-secret-dummy-secret-dummy-secret-dummy-secret
JWT_EXPIRATION=3600000
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=test
POSTGRES_USER=sa
POSTGRES_PASSWORD=
EMAIL_HOST=localhost
EMAIL_PORT=25
EMAIL_ID=dummy
EMAIL_PASSWORD=dummy
MESSAGING_SERVICE_URL=http://localhost:3020

# Disable script initializations
spring.sql.init.mode=never
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# Exclude Redis Auto-configurations & PgVectorStoreAutoConfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
