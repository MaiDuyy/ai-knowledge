version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: ai_knowledge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_knowledge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ai_knowledge_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: ai_knowledge_nats
    ports:
      - "4222:4222"   # Client port
      - "8222:8222"   # Management port
    command: ["-js"]  # Enable JetStream
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: ai_knowledge_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
